
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DPD iPhone LIVE Scanner</title>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f1f4f8;color:#243246;margin:0;padding:16px}
main{max-width:560px;margin:auto;background:white;border-radius:14px;padding:20px}
h1{font-size:24px}
video{width:100%;max-height:440px;background:#111;border-radius:10px}
button{width:100%;padding:15px;margin:8px 0;border:0;border-radius:9px;font-size:17px}
.primary{background:#d71930;color:white;font-weight:bold}
.secondary{background:#243b53;color:white}
#result{font-size:24px;font-weight:bold;word-break:break-all}
#status{font-size:14px;white-space:pre-wrap}
</style>
</head>
<body>
<main>

<h1>📱 DPD iPhone LIVE Scanner</h1>
<p>DPD-Barcode vor die Kamera halten.</p>

<video id="video" autoplay muted playsinline></video>

<button class="primary" id="start" onclick="startScanner()">
📷 Kamera starten
</button>

<button class="secondary" onclick="stopScanner()">
■ Kamera stoppen
</button>

<p id="status">Bereit.</p>
<p id="result"></p>

<button class="primary" id="send" style="display:none" onclick="sendToEPS()">
✅ Nummer bestätigen & an EPS senden
</button>

<button class="secondary" id="copy" style="display:none" onclick="copyNumber()">
📋 Paketnummer kopieren
</button>

</main>

<script>
"use strict";

let reader = null;
let foundNumber = "";
let running = false;

const $ = id => document.getElementById(id);

function normalizeDPD(raw) {
  const s = String(raw || "")
    .replace(/[\s\u200b-\u200d]/g, "");

  if (/^0608\d{10}$/.test(s)) return s;
  if (/^0608\d{10}101$/.test(s)) return s.slice(0, 14);

  return "";
}

function stopScanner() {
  running = false;

  if (reader) {
    try {
      reader.reset();
    } catch (e) {}
    reader = null;
  }

  const v = $("video");

  if (v.srcObject) {
    v.srcObject.getTracks().forEach(t => t.stop());
    v.srcObject = null;
  }

  $("start").disabled = false;
}

async function startScanner() {
  stopScanner();

  foundNumber = "";
  $("result").textContent = "";
  $("send").style.display = "none";
  $("copy").style.display = "none";
  $("start").disabled = true;
  $("status").textContent = "Kamera wird gestartet...";

  try {
    if (!window.ZXing?.BrowserMultiFormatReader) {
      throw Error("ZXing konnte nicht geladen werden.");
    }

    reader = new ZXing.BrowserMultiFormatReader();
    running = true;

    await reader.decodeFromVideoDevice(
      undefined,
      $("video"),
      (result, error) => {
        if (!running || !result) return;

        const raw =
          typeof result.getText === "function"
            ? result.getText()
            : "";

        const n = normalizeDPD(raw);
        if (!n) return;

        foundNumber = n;
        stopScanner();

        $("result").textContent = n;
        $("status").textContent =
          "Nummer erkannt. Bitte prüfen und bestätigen.";

        $("send").style.display = "block";
        $("copy").style.display = "block";
      }
    );

    if (running) {
      $("status").textContent =
        "Barcode vor die Kamera halten...";
    }
  } catch (e) {
    stopScanner();
    $("status").textContent =
      "Fehler: " + (e.message || e);
  }
}

// GOOGLE APPS SCRIPT – EPS DIGITAL
const EPS_WEBAPP_URL =
  "https://script.google.com/macros/s/AKfycbx5sauPl1MXvPjOfCanKzLx-wQdo1vAM40yoJUf6T2uqTcQoEkD_JAUpmF72A8orMhh/exec";

function sendToEPS() {
  if (!foundNumber) return;

  if (!confirm(
    "DPD-Paketnummer bestätigen?\n\n" + foundNumber
  )) {
    return;
  }

  stopScanner();

  $("status").textContent =
    "EPS wird mit der Paketnummer geöffnet...";

  // Öffnet EPS im aktuellen Scanner-Tab.
  window.location.assign(
    EPS_WEBAPP_URL +
    "?dpdscan=" +
    encodeURIComponent(foundNumber)
  );
}

async function copyNumber() {
  if (!foundNumber) return;

  try {
    await navigator.clipboard.writeText(foundNumber);
    $("status").textContent = "Paketnummer kopiert.";
  } catch (e) {
    $("status").textContent =
      "Kopieren nicht möglich. Nummer oben markieren.";
  }
}
</script>
</body>
</html>
